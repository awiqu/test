pluginManagement {
    plugins {
        id 'net.fabricmc.fabric-loom' version loom_version apply false
    }
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases'
        }
        gradlePluginPortal()
    }
}


rootProject.name = 'Patchouli'
include("Xplat", "Fabric")
