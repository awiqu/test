pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'org.jetbrains.kotlin.jvm' version kotlin_version
        id 'net.fabricmc.fabric-loom' version loom_version
    }
}

rootProject.name = 'hexcasting'
